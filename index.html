<!DOCTYPE html>
<html lang="pt-BR" style="margin:0;padding:0;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandra - Suporte</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
(function(){
  var s = document.createElement('style');
  s.textContent = ':root{--bg:#f0f2f5;--card:#fff;--text:#111b21;--muted:#667781;--verde:#00a884;--verde-soft:rgba(0,168,132,.12);--azul:#2563eb;--azul-soft:rgba(37,99,235,.12);--vermelho:#dc2626;--border:rgba(0,0,0,.06);--balao-user:#d9fdd3;--balao-bot:#fff;--balao-atendente:#d1e9ff}';
  s.textContent += '*{box-sizing:border-box}.msg-in{animation:slideIn .25s ease}@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}';
  s.textContent += '.scroll::-webkit-scrollbar{width:5px}.scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:5px}';
  document.head.appendChild(s);
})();
</script>
</head>
<body style="margin:0;padding:0;">
<div id="app" style="font-family:'Figtree',Segoe UI,Helvetica,Arial,sans-serif;background:#e9ecef;color:var(--text);min-height:100vh;padding:10px"></div>

<script>
/* ============================================================
   🔌 CHAVE INSERIDA CONFORME VOCÊ ENVIOU
   ============================================================ */
const SUPA_URL = "https://vushqzsxhnfrlxyuodcb.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1c2hxenN4aG5mcmx4eXVvZGNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzczNzcsImV4cCI6MjEwMDgxMzM3N30.HBEg3WwJqG8jZVrCYVMYq1IjqK0yUSnnBXmfTc7mgDc";

const app = document.getElementById("app");
let supabase = null;
let ERRO = "";

try{
  supabase = window.supabase.createClient(SUPA_URL, SUPA_KEY, {
    realtime: { params: { eventsPerSecond: 10 } },
    auth: { persistSession: false }
  });
  console.log("✅ Supabase inicializado com a chave correta");
}catch(e){
  ERRO = "Erro ao criar cliente: " + e.message;
  console.error("❌", ERRO);
}

async function testarConexao(){
  if(!supabase){ ERRO = "Biblioteca Supabase não carregou"; return false; }
  try{
    const { error } = await supabase.from('mensagens').select('id').limit(1);
    if(error){ ERRO = "SUPABASE ERRO: " + error.message; return false; }
    console.log("✅ Conexão com banco OK");
    return true;
  }catch(e){
    ERRO = "FALHA DE REDE/CORS: " + e.message + "\n\n→ Libere o domínio no Supabase";
    return false;
  }
}

function pegaClienteId(){
  let id = localStorage.getItem('iptv_cliente_id');
  if(!id){ id = 'cli_'+Math.random().toString(36).slice(2,12); localStorage.setItem('iptv_cliente_id',id); }
  return id;
}
const CLIENTE_ID = pegaClienteId();
const EH_PAINEL = new URLSearchParams(location.search).get('painel') === 'true';
const hora = d => d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');

async function enviarMsg(dados){
  try{
    const { error } = await supabase.from('mensagens').insert(dados);
    if(error){
      alert("❌ NÃO ENVIOU!\n\n" + error.message + "\n\n→ Verifique permissões/CORS no Supabase");
      return false;
    }
    return true;
  }catch(e){
    alert("❌ BLOQUEADO!\n\n" + e.message + "\n→ Libere o domínio no Supabase");
    return false;
  }
}
async function listarCliente(){
  try{ const {data}=await supabase.from('mensagens').select('*').eq('cliente_id',CLIENTE_ID).order('id'); return data||[]; }catch(e){ return []; }
}

function renderChat(alvo, msgs, eu){
  alvo.innerHTML='';
  if(!msgs.length) return;
  msgs.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  msgs.forEach(m=>{
    const w=document.createElement('div'); w.className='msg-in';
    const dir = (eu==='cliente'&&m.remetente==='cliente')||(eu==='atendente'&&m.remetente==='humano');
    w.style.cssText=`display:flex;justify-content:${dir?'flex-end':'flex-start'};align-items:flex-end;gap:6px;padding:1px 2px`;
    if(!dir){
      const av=document.createElement('div');
      const cor = m.remetente==='humano'?'linear-gradient(135deg,#2563eb,#1e40af)':'linear-gradient(135deg,#00a884,#008069)';
      av.style.cssText=`width:24px;height:24px;border-radius:50%;background:${cor};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10.5px;flex-shrink:0;margin-bottom:2px`;
      av.textContent = m.remetente==='humano'?'🧑':(m.remetente==='cliente'?'C':'S');
      w.appendChild(av);
    }
    const b=document.createElement('div');
    let corF,raio,rot='';
    if(m.remetente==='cliente'){ corF='var(--balao-user)'; raio='12px 12px 2px 12px'; }
    else if(m.remetente==='humano'){ corF='var(--balao-atendente)'; raio='12px 12px 12px 2px'; rot='<div style="font-size:9.5px;color:var(--azul);font-weight:800;margin-bottom:2px">🧑 HUMANO</div>'; }
    else{ corF='var(--balao-bot)'; raio='12px 12px 12px 2px'; rot='<div style="font-size:9.5px;color:var(--verde);font-weight:700;margin-bottom:2px">🤖 AUTO</div>'; }
    b.style.cssText=`max-width:80%;padding:6px 9px 5px;border-radius:${raio};background:${corF};box-shadow:0 1px 1px rgba(0,0,0,.05);font-size:13.8px;line-height:1.4`;
    b.innerHTML = rot + m.texto + `<span style="font-size:9px;color:#667781;float:right;margin-left:6px;margin-top:5px">${hora(new Date(m.created_at))}</span>`;
    w.appendChild(b); alvo.appendChild(w);
  });
  alvo.scrollTop = alvo.scrollHeight;
}

function renderCliente(){
  app.innerHTML = `
  <div class="max-w-xl mx-auto" style="background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden">
    <div style="background:#f0f2f5;padding:10px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)">
      <div style="position:relative"><div style="width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#00a884,#008069);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px">S</div><span style="position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:#25d366;border:2px solid #f0f2f5"></span></div>
      <div style="flex:1"><div style="font-weight:600;font-size:15px">Sandra 👩‍💼</div><div id="st" style="font-size:11.5px;color:var(--muted);margin-top:-1px">online</div></div>
    </div>
    <div id="chat" class="scroll" style="height:540px;overflow-y:auto;padding:14px 10px;background:#efeae2;display:flex;flex-direction:column;gap:4px"></div>
    <div style="padding:8px 10px;background:#f0f2f5;display:flex;gap:8px;align-items:center">
      <input id="inp" placeholder="Digite aqui e clique em ➤" style="flex:1;min-height:42px;padding:0 14px;border:none;border-radius:22px;font-size:14px;outline:none;background:#fff">
      <button id="btn" style="width:42px;height:42px;border:none;border-radius:50%;background:var(--verde);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px">➤</button>
    </div>
  </div>`;

  const chat=document.getElementById('chat');
  const inp=document.getElementById('inp');
  const btn=document.getElementById('btn');
  const st=document.getElementById('st');

  async function carregar(){
    const d = await listarCliente();
    renderChat(chat, d, 'cliente');
    if(d.length){
      const u = d[d.length-1];
      st.textContent = u.modo_atendimento==='humano' ? '🧑 humano respondendo' : '🤖 automático';
    }
  }

  async function enviar(){
    const t = inp.value.trim();
    if(!t){ alert("Digite alguma coisa!"); return; }
    inp.value = '';

    const ok = await enviarMsg({
      cliente_id: CLIENTE_ID,
      nome_cliente: 'Cliente ' + CLIENTE_ID.slice(-4).toUpperCase(),
      remetente: 'cliente',
      texto: t,
      modo_atendimento: 'auto',
      lida: false
    });
    if(!ok) return;

    setTimeout(async ()=>{
      await enviarMsg({
        cliente_id: CLIENTE_ID,
        remetente: 'bot',
        atendente_nome: 'Sandra',
        texto: '✅ Recebi sua mensagem! Em breve te respondo 😊',
        modo_atendimento: 'auto'
      });
    }, 700);
  }

  btn.addEventListener('click', enviar);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') enviar(); });

  try{
    supabase.channel('cli_'+CLIENTE_ID)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'mensagens',filter:`cliente_id=eq.${CLIENTE_ID}`}, carregar)
      .subscribe();
  }catch(e){}

  carregar();
}

window.addEventListener('load', async ()=>{
  app.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">⏳ Carregando...</div>';
  const ok = await testarConexao();

  if(!ok){
    app.innerHTML = `
    <div style="max-width:600px;margin:30px auto;background:#fff;border-radius:12px;padding:22px">
      <h2 style="color:var(--vermelho)">⚠️ Falha na conexão</h2>
      <p style="background:#fef2f2;padding:12px;border-radius:8px;white-space:pre-wrap">${ERRO}</p>
      <h3>✅ Faça isso no Supabase:</h3>
      <ol style="line-height:1.8">
        <li>Authentication → URLs: adicione <code>https://sistemadelaudosubs-byte.github.io/Sandra-bot/*</code></li>
        <li>Settings → API → CORS: adicione <code>https://sistemadelaudosubs-byte.github.io</code></li>
        <li>Database → Replication: marque a tabela <code>mensagens</code></li>
      </ol>
    </div>`;
    return;
  }

  EH_PAINEL
    ? app.innerHTML = '<div style="padding:40px;text-align:center">🧑 Painel: <a href="?painel=true" style="color:var(--azul)">abrir</a></div>'
    : renderCliente();
});
</script>
</body>
</html>
