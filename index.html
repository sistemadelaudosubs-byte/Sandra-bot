/* ============================================================

const SOM = {
  ativo: localStorage.getItem('som_atendimento') === '1',
  ctx: null,
  iniciar(){
    try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  },
  tocar(){
    if(!this.ativo) return;
    if(!this.ctx) this.iniciar();
    if(!this.ctx) return;
    if(this.ctx.state === 'suspended') this.ctx.resume();
    const tocarTom = (freq, inicio, dur=0.12) => {
      try{
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0, this.ctx.currentTime+inicio);
        g.gain.linearRampToValueAtTime(0.25, this.ctx.currentTime+inicio+0.01);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+inicio+dur);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(this.ctx.currentTime+inicio);
        o.stop(this.ctx.currentTime+inicio+dur+0.02);
      }catch(e){}
    };
    tocarTom(880, 0);
    tocarTom(1320, 0.14);
  },
  ligar(){ this.ativo=true; localStorage.setItem('som_atendimento','1'); this.iniciar(); this.tocar(); },
  desligar(){ this.ativo=false; localStorage.setItem('som_atendimento','0'); }
};

/* ============================================================
   🧠 CÉREBRO DA SANDRA ROBÔ
   ============================================================ */
const SOL = {
  trava:['Desliga da tomada 30s amor 😊','Testa velocidade da internet (mínimo 15MB)','Troca p/ Servidor BR 2 nas configs','Fecha app completamente'],
  login:['Vê se não tem espaço no final da senha querido','Caps Lock desligado viu?','Gero senha nova se quiser','Clica em esqueci minha senha'],
  canais:['Atualiza lista de canais primeiro 📺','Se for 1-2 canais é manutenção','Limpa cache do app'],
  qualidade:['Bota qualidade em 1080p/4K no player','Conecta Wi-Fi 5GHz','Tira outros aparelhos da internet'],
  pagamento:['PIX cai na hora 💸','Cartão até 24h','Boleto 3 dias úteis','Manda comprovante que vejo já'],
  instalacao:['Smart TV: loja oficial','TV Box: Downloader','Celular: Play/App Store','Te mando link se quiser']
};
const R = a => a[Math.floor(Math.random()*a.length)];
const tempoDig = t => Math.min(2600, Math.max(600, t.length*32+350));
const hora = d => d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');

function cerebro(t){
  t = t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  if(/^(oi|ola|bom dia|boa tarde|boa noite|opa|e ai|eai|oie)\b/.test(t))
    return {tipo:'m', msgs:R([['Oiii querido! Tudo bem? 😊','Sou a Sandra, em que posso ajudar?'],['Bom dia vida! 🥰','Me conta o que precisa que a gente resolve.']])};
  if(/(obrigad|valeu|funcionou|resolveu|deu certo)/.test(t))
    return {tipo:'m', msgs:R([['De nadaaa amor 🥰','Qualquer coisa é só chamar!'],['Que ótima notícia! Fico feliz ❤️']])};
  if(/(tudo bem|e voce|e você)/.test(t))
    return {tipo:'m', msgs:[['Estou ótima obrigada! 😊','E você? Qual problema temos hoje?']]};
  if(/(humano|pessoa|voce e robo|você é robô|robô|robo|atendente)/.test(t))
    return {tipo:'pedir_humano'};
  const mapa=[
    {k:['trava','travando','cai','caindo','congela','cortando'],s:'trava',intro:['Ah que saco né 😩','Vamos resolver já querido:']},
    {k:['logar','login','senha','entrar','não entra','bloqueado'],s:'login',intro:['Acontece muito viu 😊','Tenta isso:']},
    {k:['canal','canais','fora do ar','tela preta','não abre'],s:'canais',intro:['Vamos ver isso 📺','Tenta aí:']},
    {k:['qualidade','pixel','ruim','embassada','resolução'],s:'qualidade',intro:['Vamos deixar perfeito 💪','Olha só:']},
    {k:['pagamento','pagar','paguei','pix','cartao','boleto','bloqueou'],s:'pagamento',intro:['Verificando seu pagamento 💸','Olha como funciona:']},
    {k:['instalar','baixar','app','aplicativo','smart tv','tv box'],s:'instalacao',intro:['Claro que ajudo a instalar 📲','Depende do aparelho:']}
  ];
  for(let it of mapa) if(it.k.some(p=>t.includes(p))) return {tipo:'s', s:it.s, intro:it.intro};
  return {tipo:'m', msgs:R([['Desculpa querido, não entendi bem 😅','Pode explicar melhor o que acontece?'],['Hmm, me conta mais detalhes por favor 🥰']])};
}

async function enviarMsg(dados){ try{ await supabase.from('mensagens').insert(dados); }catch(e){console.error(e);} }
async function modoAtual(clienteId){
  try{
    const {data} = await supabase.from('mensagens').select('modo_atendimento').eq('cliente_id',clienteId).order('id',{ascending:false}).limit(1);
    return (data && data[0]) ? data[0].modo_atendimento : 'auto';
  }catch(e){ return 'auto'; }
}
async function listarConversas(){
  try{
    const {data} = await supabase.from('mensagens').select('cliente_id,nome_cliente,texto,remetente,modo_atendimento,created_at,lida').order('id',{ascending:false});
    const convs = {};
    (data||[]).forEach(m=>{
      if(!convs[m.cliente_id]) convs[m.cliente_id] = {id:m.cliente_id, nome:m.nome_cliente, ultima:m, msgs:[], naoLidas:0};
      convs[m.cliente_id].msgs.push(m);
      if(m.remetente==='cliente' && !m.lida) convs[m.cliente_id].naoLidas++;
    });
    return Object.values(convs).sort((a,b)=>new Date(b.ultima.created_at)-new Date(a.ultima.created_at));
  }catch(e){ return []; }
}

/* ============================================================
   🖼️ RENDERIZA CHAT
   ============================================================ */
function renderChat(alvo, msgs, euSou='cliente'){
  alvo.innerHTML = '';
  if(!msgs.length) return;
  msgs.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  msgs.forEach(m=>{
    const w=document.createElement('div'); w.className='msg-in';
    const direita = (euSou==='cliente' && m.remetente==='cliente') || (euSou==='atendente' && m.remetente==='humano');
    w.style.cssText = `display:flex;justify-content:${direita?'flex-end':'flex-start'};align-items:flex-end;gap:6px;padding:1px 2px`;
    if(!direita){
      const av=document.createElement('div');
      const cor = m.remetente==='humano' ? 'linear-gradient(135deg,#2563eb,#1e40af)' : 'linear-gradient(135deg,#00a884,#008069)';
      av.style.cssText = `width:24px;height:24px;border-radius:50%;background:${cor};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10.5px;flex-shrink:0;margin-bottom:2px`;
      av.textContent = m.remetente==='humano' ? '🧑' : (m.remetente==='cliente'?'C':'S');
      w.appendChild(av);
    }
    const b=document.createElement('div');
    let corFundo, raio, rot='';
    if(m.remetente==='cliente'){ corFundo='var(--balao-user)'; raio='12px 12px 2px 12px'; }
    else if(m.remetente==='humano'){ corFundo='var(--balao-atendente)'; raio='12px 12px 12px 2px'; rot='<div style="font-size:9.5px;color:var(--azul);font-weight:800;margin-bottom:2px">🧑 HUMANO</div>'; }
    else { corFundo='var(--balao-bot)'; raio='12px 12px 12px 2px'; rot='<div style="font-size:9.5px;color:var(--verde);font-weight:700;margin-bottom:2px">🤖 AUTOMÁTICO</div>'; }
    b.style.cssText = `max-width:80%;padding:6px 9px 5px 9px;border-radius:${raio};background:${corFundo};box-shadow:0 1px 1px rgba(0,0,0,.05);font-size:13.8px;line-height:1.4`;
    b.innerHTML = rot + m.texto + `<span style="font-size:9px;color:#667781;float:right;margin-left:6px;margin-top:5px">${hora(new Date(m.created_at))}</span>`;
    w.appendChild(b); alvo.appendChild(w);
  });
  alvo.scrollTop = alvo.scrollHeight;
}

    b.style.cssText='min-height:26px;padding:3px 10px;border:none;border-radius:14px;background:#dbeafe;color:var(--azul);font-size:11px;font-weight:600;cursor:pointer';
    b.onclick=()=>{ if(CONVERSA_ATIVA){ inputAtd.value=t; inputAtd.focus(); }};
    rpRapidas.appendChild(b);
  });

  async function carregarLista(){
    const convs = await listarConversas();
    listaConvs.innerHTML='';
    if(!convs.length){ listaConvs.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Nenhuma conversa ainda</div>'; return; }
    convs.forEach(c=>{
      const d=document.createElement('div');
      const ativa = CONVERSA_ATIVA===c.id;
      d.style.cssText = `padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;${ativa?'background:var(--azul-soft);border-left:3px solid var(--azul)':''}`;
      d.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:700;font-size:13.5px">${c.nome} ${c.naoLidas?`<span class="piscar" style="background:var(--vermelho);color:#fff;padding:1px 7px;border-radius:10px;font-size:10px;margin-left:6px">${c.naoLidas}</span>`:''}</div>
          <div style="font-size:10px;color:var(--muted)">${hora(new Date(c.ultima.created_at))}</div>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.ultima.remetente==='cliente'?'👤 ':'🧑 '}${c.ultima.texto}</div>
        <div style="font-size:10.5px;margin-top:3px;color:${c.ultima.modo_atendimento==='humano'?'var(--azul)':'var(--verde)'}">${c.ultima.modo_atendimento==='humano'?'🧑 Humano':'🤖 Automático'}</div>`;
      d.onclick=()=>abrirConversa(c.id);
      listaConvs.appendChild(d);
    });
  }

  async function abrirConversa(id){
    CONVERSA_ATIVA = id;
    await marcarLidas(id);
    const {data} = await supabase.from('mensagens').select('*').eq('cliente_id',id).order('id');
    const modo = (data && data.length) ? data[data.length-1].modo_atendimento : 'auto';
    topoConv.innerHTML = `<div><div style="font-weight:700;color:var(--azul)">💬 Conversa: Cliente ${id.slice(-4).toUpperCase()}</div><div style="font-size:11px;color:var(--muted)">Modo: ${modo==='humano'?'🧑 HUMANO':'🤖 AUTOMÁTICO'}</div></div>`;
    botoesModo.innerHTML='';
    const bHum=document.createElement('button'); bHum.textContent='🧑 Virar Humano';
    bHum.style.cssText=`min-height:32px;padding:0 12px;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;${modo==='humano'?'background:#ccc;pointer-events:none;color:#666':'background:var(--azul);color:#fff'}`;
    bHum.onclick=async ()=>{await assumirHumano(id);abrirConversa(id)};
    const bAuto=document.createElement('button'); bAuto.textContent='🤖 Voltar Automático';
    bAuto.style.cssText=`min-height:32px;padding:0 12px;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;margin-left:6px;${modo==='auto'?'background:#ccc;pointer-events:none;color:#666':'background:var(--verde);color:#fff'}`;
    bAuto.onclick=async ()=>{await voltarAuto(id);abrirConversa(id)};
    botoesModo.appendChild(bHum); botoesModo.appendChild(bAuto);
    renderChat(chatAtd, data||[], 'atendente');
    inputAtd.disabled = modo!=='humano';
    enviarAtd.disabled = modo!=='humano';
    inputAtd.placeholder = modo==='humano' ? '✅ Você está respondendo! Escreva...' : '🔒 Modo automático - clique em Virar Humano';
    carregarLista();
  }

  async function enviarHumano(){
    if(!CONVERSA_ATIVA) return;
    const t = inputAtd.value.trim(); if(!t) return;
    inputAtd.value='';
    await enviarMsg({cliente_id:CONVERSA_ATIVA, remetente:'humano', atendente_nome:'Sandra', texto:t, modo_atendimento:'humano'});
  }
  enviarAtd.onclick=enviarHumano;
  inputAtd.addEventListener('keypress',e=>{if(e.key==='Enter')enviarHumano()});

  let ultimoId = 0;
  try{
    supabase.channel('painel-todas').on('postgres_changes',{event:'INSERT',schema:'public',table:'mensagens'},async (payload)=>{
      const m = payload.new;
      if(m.remetente === 'cliente' && m.id > ultimoId){
        ultimoId = m.id;
        const ok = (CONVERSA_ATIVA === m.cliente_id) && document.visibilityState === 'visible';
        if(!ok){ SOM.tocar(); }
      }
      carregarLista();
      if(CONVERSA_ATIVA) abrirConversa(CONVERSA_ATIVA);
    }).subscribe();
  }catch(e){}

  carregarLista();
}

/* ============================================================
   🚀 INICIO — NÃO QUEBRA MAIS!
   ============================================================ */
window.addEventListener('load', () => {
  try{
    EH_PAINEL ? renderPainel() : renderCliente();
  }catch(e){
    console.error("❌ Erro ao carregar:",e);
    document.getElementById("app").innerHTML = '<div style="padding:40px;text-align:center"><h2>⚠️ Erro ao carregar</h2><p>'+e.message+'</p></div>';
  }
});
</script>
