const SOM = {
  ativo: localStorage.getItem('som_atendimento') === '1',
  ctx: null,
  iniciar(){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  tocar(){
    if(!this.ativo) return;
    if(!this.ctx) this.iniciar();
    if(!this.ctx) return;
    if(this.ctx.state === 'suspended') this.ctx.resume();
    const t=(f,i,d=0.12)=>{try{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,this.ctx.currentTime+i);g.gain.linearRampToValueAtTime(0.28,this.ctx.currentTime+i+0.01);g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+i+d);o.connect(g);g.connect(this.ctx.destination);o.start(this.ctx.currentTime+i);o.stop(this.ctx.currentTime+i+d+0.02)}catch(e){}};
    t(880,0); t(1320,0.14);
  },
  ligar(){ this.ativo=true; localStorage.setItem('som_atendimento','1'); this.iniciar(); this.tocar(); },
  desligar(){ this.ativo=false; localStorage.setItem('som_atendimento','0'); }
};

/* ============================================================
   🧠 CÉREBRO SANDRA
   ============================================================ */
const SOL = {
  trava:['Desliga da tomada 30s amor 😊','Testa velocidade da internet (mínimo 15MB)','Troca p/ Servidor BR 2 nas configs','Fecha app completamente'],
  login:['Vê se não tem espaço no final da senha querido','Caps Lock desligado viu?','Gero senha nova se quiser','Clica em esqueci minha senha'],
  canais:['Atualiza lista de canais primeiro 📺','Se for 1-2 canais é manutenção','Limpa cache do app'],
  qualidade:['Bota qualidade em 1080p/4K no player','Conecta Wi-Fi 5GHz','Tira outros aparelhos da internet'],
  pagamento:['PIX cai na hora 💸','Cartão até 24h','Boleto 3 dias úteis','Manda comprovante que vejo já'],
  instalacao:['Smart TV: loja oficial','TV Box: Downloader','Celular: Play/App Store','Te mando link se quiser']
};
const R = a => a[Math.floor(Math.random()*a.length)];
const tempoDig = t => Math.min(2600, Math.max(600, t.length*32+350));
const hora = d => d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');

function cerebro(t){
  t = t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  if(/^(oi|ola|bom dia|boa tarde|boa noite|opa|e ai|eai|oie)\b/.test(t))
    return {tipo:'m', msgs:R([['Oiii querido! Tudo bem? 😊','Sou a Sandra, em que posso ajudar?'],['Bom dia vida! 🥰','Me conta o que precisa que a gente resolve.']])};
  if(/(obrigad|valeu|funcionou|resolveu|deu certo)/.test(t))
    return {tipo:'m', msgs:R([['De nadaaa amor 🥰','Qualquer coisa é só chamar!'],['Que ótima notícia! Fico feliz em ajudar ❤️']])};
  if(/(tudo bem|e voce|e você)/.test(t))
    return {tipo:'m', msgs:[['Estou ótima obrigada! 😊','E você? Qual problema temos hoje?']]};
  if(/(humano|pessoa|voce e robo|você é robô|rob[ôo]|robo|atendente|falar com|alguem|alguém)/.test(t))
    return {tipo:'pedir_humano'};
  const mapa=[
    {k:['trava','travando','cai','caindo','congela','cortando'],s:'trava',intro:['Ah que saco né 😩','Vamos resolver já querido:']},
    {k:['logar','login','senha','entrar','não entra','bloqueado'],s:'login',intro:['Acontece muito viu 😊','Tenta isso:']},
    {k:['canal','canais','fora do ar','tela preta','não abre'],s:'canais',intro:['Vamos ver isso 📺','Tenta aí:']},
    {k:['qualidade','pixel','ruim','embacada','resolução'],s:'qualidade',intro:['Vamos deixar perfeito 💪','Olha só:']},
    {k:['pagamento','pagar','paguei','pix','cartao','cartão','boleto','bloqueou'],s:'pagamento',intro:['Verificando seu pagamento 💸','Olha como funciona:']},
    {k:['instalar','baixar','app','smart tv','tv box'],s:'instalacao',intro:['Claro que ajudo a instalar 📲','Depende do aparelho:']}
  ];
  for(let it of mapa) if(it.k.some(p=>t.includes(p))) return {tipo:'s', s:it.s, intro:it.intro};
  return {tipo:'m', msgs:R([['Desculpa querido, não entendi bem 😅','Pode explicar melhor o que acontece?'],['Hmm, me conta mais detalhes por favor 🥰']])};
}

/* ============================================================
   💾 BANCO
   ============================================================ */
async function enviarMsg(dados){
  try{
    const { error } = await supabase.from('mensagens').insert(dados);
    if(error){ alert("❌ Erro:\n"+error.message); return false; }
    return true;
  }catch(e){ alert("❌ Bloqueado (CORS):\n"+e.message); return false; }
}
async function listarMsgs(cid){ try{const{data}=await supabase.from('mensagens').select('*').eq('cliente_id',cid).order('id');return data||[]}catch(e){return []} }
async function modoAtual(cid){ try{const{data}=await supabase.from('mensagens').select('modo_atendimento').eq('cliente_id',cid).order('id',{ascending:false}).limit(1);return(data&&data[0])?data[0].modo_atendimento:'auto'}catch(e){return 'auto'} }
async function listarConversas(){
  try{
    const{data}=await supabase.from('mensagens').select('cliente_id,nome_cliente,texto,remetente,modo_atendimento,created_at,lida').order('id',{ascending:false});
    const c={};(data||[]).forEach(m=>{if(!c[m.cliente_id])c[m.cliente_id]={id:m.cliente_id,nome:m.nome_cliente,ultima:m,msgs:[],naoLidas:0};c[m.cliente_id].msgs.push(m);if(m.remetente==='cliente'&&!m.lida)c[m.cliente_id].naoLidas++;});
    return Object.values(c).sort((a,b)=>new Date(b.ultima.created_at)-new Date(a.ultima.created_at));
  }catch(e){return []}
}
async function marcarLidas(cid){ try{await supabase.from('mensagens').update({lida:true}).eq('cliente_id',cid).eq('remetente','cliente').eq('lida',false)}catch(e){} }

/* ============================================================
   🤖 ROBÔ SÓ SE MODO=AUTO
   ============================================================ */
async function roboRespondeSePuder(cid, txt){
  const modo = await modoAtual(cid);
  if(modo === 'humano') return;
  const r = cerebro(txt);
  if(r.tipo === 'pedir_humano'){
    await new Promise(rs=>setTimeout(rs,900));
    await enviarMsg({cliente_id:cid,remetente:'bot',texto:'Claro! Já chamo um atendente humano para você 🧑',modo_atendimento:'humano'});
    return;
  }
  if(r.tipo === 'm'){
    for(let i=0;i<r.msgs.length;i++){
      await new Promise(rs=>setTimeout(rs, tempoDig(r.msgs[i])+300));
      await enviarMsg({cliente_id:cid,remetente:'bot',texto:r.msgs[i],modo_atendimento:'auto'});
    }
  } else {
    await new Promise(rs=>setTimeout(rs,900));
    await enviarMsg({cliente_id:cid,remetente:'bot',texto:r.intro[0],modo_atendimento:'auto'});
    await new Promise(rs=>setTimeout(rs,700));
    await enviarMsg({cliente_id:cid,remetente:'bot',texto:r.intro[1],modo_atendimento:'auto'});
    for(let i=0;i<SOL[r.s].length;i++){
      await new Promise(rs=>setTimeout(rs,1100));
      await enviarMsg({cliente_id:cid,remetente:'bot',texto:`${i+1}. ${SOL[r.s][i]}`,modo_atendimento:'auto'});
    }
  }
}

/* ============================================================
   🖼️ RENDER CHAT
   ============================================================ */
function renderChat(alvo, msgs, eu){
  alvo.innerHTML='';
  if(!msgs.length) return;
  msgs.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  msgs.forEach(m=>{
    const w=document.createElement('div'); w.className='msg-in';
    const dir = (eu==='cliente'&&m.remetente==='cliente')||(eu==='atendente'&&m.remetente==='humano');
    w.style.cssText=`display:flex;justify-content:${dir?'flex-end':'flex-start'};align-items:flex-end;gap:6px;padding:1px 2px`;
    if(!dir){
      const av=document.createElement('div');
      const cor = m.remetente==='humano'?'linear-gradient(135deg,#2563eb,#1e40af)':'linear-gradient(135deg,#00a884,#008069)';
      av.style.cssText=`width:24px;height:24px;border-radius:50%;background:${cor};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10.5px;flex-shrink:0;margin-bottom:2px`;
      av.textContent = m.remetente==='humano'?'🧑':(m.remetente==='cliente'?'C':'S');
      w.appendChild(av);
    }
    const b=document.createElement('div');
    let corF,raio,rot='';
    if(m.remetente==='cliente'){ corF='var(--balao-user)'; raio='12px 12px 2px 12px'; }
    else if(m.remetente==='humano'){ corF='var(--balao-atendente)'; raio='12px 12px 12px 2px'; rot='<div style="font-size:9.5px;color:var(--azul);font-weight:800;margin-bottom:2px">🧑 SANDRA</div>'; }
    else{ corF='var(--balao-bot)'; raio='12px 12px 12px 2px'; rot='<div style="font-size:9.5px;color:var(--verde);font-weight:700;margin-bottom:2px">🤖 AUTO</div>'; }
    b.style.cssText=`max-width:80%;padding:6px 9px 5px;border-radius:${raio};background:${corF};box-shadow:0 1px 1px rgba(0,0,0,.05);font-size:13.8px;line-height:1.4`;
    b.innerHTML = rot + m.texto + `<span style="font-size:9px;color:#667781;float:right;margin-left:6px;margin-top:5px">${hora(new Date(m.created_at))}</span>`;
    w.appendChild(b); alvo.appendChild(w);
  });
  alvo.scrollTop = alvo.scrollHeight;
}

      <div style="flex:1"><div style="font-weight:600;font-size:15px">Sandra 👩‍💼</div><div id="st" style="font-size:11.5px;color:var(--muted);margin-top:-1px">online</div></div>
      <button id="btnR" style="border:none;background:var(--verde-soft);color:var(--verde);padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer">🔄</button>
    </div>
    <div id="chat" class="scroll" style="height:540px;overflow-y:auto;padding:14px 10px;background:#efeae2;display:flex;flex-direction:column;gap:4px"></div>

      <button id="btn" style="width:42px;height:42px;border:none;border-radius:50%;background:var(--verde);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px">➤</button>
    </div>
  </div>`;

  const chat=document.getElementById('chat'), inp=document.getElementById('inp'), btn=document.getElementById('btn'), st=document.getElementById('st'), btnR=document.getElementById('btnR');
  let cache = "";

  async function carregar(){
    const d = await listarMsgs(CLIENTE_ID);
    const str = JSON.stringify(d);
    if(str === cache) return;
    cache = str;
    renderChat(chat, d, 'cliente');
    if(d.length){ const u=d[d.length-1]; st.textContent = u.modo_atendimento==='humano'?'🧑 atendente humano respondendo':'🤖 atendimento automático'; }
  }

  async function enviar(){
    const t=inp.value.trim(); if(!t) return; inp.value='';
    const modo = await modoAtual(CLIENTE_ID);
    const ok = await enviarMsg({cliente_id:CLIENTE_ID,nome_cliente:'Cliente '+CLIENTE_ID.slice(-4).toUpperCase(),remetente:'cliente',texto:t,modo_atendimento:modo,lida:false});
    if(ok){ await carregar(); if(modo==='auto') roboRespondeSePuder(CLIENTE_ID, t); }
  }

  btn.addEventListener('click',enviar); inp.addEventListener('keydown',e=>{if(e.key==='Enter')enviar()});
  btnR.addEventListener('click', carregar);

    supabase.channel('cli_'+CLIENTE_ID)

  }

      const ativa=CONVERSA_ATIVA===c.id;
      d.style.cssText=`padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;${ativa?'background:var(--azul-soft);border-left:3px solid var(--azul)':''}`;
      d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:700;font-size:13.5px">${c.nome} ${c.naoLidas?`<span class="piscar" style="background:var(--vermelho);color:#fff;padding:1px 7px;border-radius:10px;font-size:10px;margin-left:6px">${c.naoLidas}</span>`:''}</div><div style="font-size:10px;color:var(--muted)">${hora(new Date(c.ultima.created_at))}</div></div><div style="font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.ultima.remetente==='cliente'?'👤 ':'🧑 '}${c.ultima.texto}</div><div style="font-size:10.5px;margin-top:3px;color:${c.ultima.modo_atendimento==='humano'?'var(--azul)':'var(--verde)'}">${c.ultima.modo_atendimento==='humano'?'🧑 Humano':'🤖 Automático'}</div>`;
      d.onclick=()=>abrir(c.id);
      lista.appendChild(d);
    });
  }

  async function abrir(id){
    CONVERSA_ATIVA=id; await marcarLidas(id);
    const d=await listarMsgs(id);
    const modo=(d&&d.length)?d[d.length-1].modo_atendimento:'auto';
    topo.innerHTML=`<div><div style="font-weight:700;color:var(--azul)">💬 Cliente ${id.slice(-4).toUpperCase()}</div><div style="font-size:11px;color:var(--muted)">Modo: ${modo==='humano'?'🧑 HUMANO':'🤖 AUTOMÁTICO'}</div></div>`;
    bm.innerHTML='';
    const bh=document.createElement('button');bh.textContent='🧑 Virar Humano';
    bh.style.cssText=`min-height:32px;padding:0 12px;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;${modo==='humano'?'background:#ccc;pointer-events:none;color:#666':'background:var(--azul);color:#fff'}`;
    bh.onclick=async ()=>{
      await enviarMsg({cliente_id:id,remetente:'humano',atendente_nome:'Sandra',texto:'✅ Olá! Sou a Sandra, agora estou eu respondendo pessoalmente 😊 Em que posso ajudar?',modo_atendimento:'humano'});
      abrir(id);
    };
    const ba=document.createElement('button');ba.textContent='🤖 Voltar Auto';
    ba.style.cssText=`min-height:32px;padding:0 12px;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;margin-left:6px;${modo==='auto'?'background:#ccc;pointer-events:none;color:#666':'background:var(--verde);color:#fff'}`;
    ba.onclick=async ()=>{
      await enviarMsg({cliente_id:id,remetente:'bot',texto:'🤖 Voltando ao atendimento automático.',modo_atendimento:'auto'});
      abrir(id);
    };
    bm.appendChild(bh);bm.appendChild(ba);
    renderChat(chatA, d||[], 'atendente');
    inpA.disabled=modo!=='humano';envA.disabled=modo!=='humano';
    inpA.placeholder=modo==='humano'?'✅ Escreva e envie...':'🔒 Clique em Virar Humano';
    carregarLista();
  }

  // ✅ CORREÇÃO PRINCIPAL: quando VOCÊ envia, grava e ATUALIZA NA HORA
  async function enviarHumano(){
    if(!CONVERSA_ATIVA) return;
    const t=inpA.value.trim();if(!t)return;inpA.value='';
    const ok = await enviarMsg({cliente_id:CONVERSA_ATIVA,remetente:'humano',atendente_nome:'Sandra',texto:t,modo_atendimento:'humano'});
    if(ok){
      const d=await listarMsgs(CONVERSA_ATIVA); // atualiza imediatamente
      renderChat(chatA, d||[], 'atendente');
      carregarLista();
    }
  }
  envA.onclick=enviarHumano; inpA.addEventListener('keydown',e=>{if(e.key==='Enter')enviarHumano()});

  // Realtime + polling
  try{
    supabase.channel('painel').on('postgres_changes',{event:'*',schema:'public',table:'mensagens'},async p=>{
      const m=p.new;
      if(m.remetente==='cliente'&&m.id>ultId){
        ultId=m.id;
        if(!(CONVERSA_ATIVA===m.cliente_id&&document.visibilityState==='visible')) SOM.tocar();
      }
      carregarLista();
      if(CONVERSA_ATIVA){ const d=await listarMsgs(CONVERSA_ATIVA); renderChat(chatA,d||[],'atendente'); }
    }).subscribe();
  }catch(e){}
  setInterval(async ()=>{
    carregarLista();
    if(CONVERSA_ATIVA){ const d=await listarMsgs(CONVERSA_ATIVA); renderChat(chatA,d||[],'atendente'); }
  }, 4000);

  carregarLista();
}

/* ============================================================
   🚀 INICIO
   ============================================================ */
window.addEventListener('load', ()=>{
  app.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted)">⏳ Carregando...</div>';
  EH_PAINEL ? renderPainel() : renderCliente();
});
</script>
</body>
</html>
